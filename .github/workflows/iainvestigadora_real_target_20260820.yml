name: IA Investigadora real target 2026-08-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iainvestigadora_real_target_20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture official MLB target
        run: |
          python - <<'PY'
          import json, urllib.request, hashlib, pathlib
          url='https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2026-08-20&hydrate=probablePitcher,venue,team'
          with urllib.request.urlopen(url, timeout=30) as r:
              raw=r.read()
          data=json.loads(raw)
          games=[g for d in data.get('dates',[]) for g in d.get('games',[])]
          matches=[]
          for g in games:
              away=g['teams']['away']['team']['name']
              home=g['teams']['home']['team']['name']
              if away=='St. Louis Cardinals' and home=='Cincinnati Reds':
                  matches.append(g)
          if len(matches)!=1:
              raise SystemExit(f'Expected exactly one STL@CIN game, got {len(matches)}')
          g=matches[0]
          out={
              'source':'MLB_STATS_API',
              'source_url':url,
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'game_pk':g['gamePk'],
              'game_date':g['gameDate'],
              'official_date':g['officialDate'],
              'status':g['status'],
              'away':g['teams']['away']['team'],
              'home':g['teams']['home']['team'],
              'away_probable_pitcher':g['teams']['away'].get('probablePitcher'),
              'home_probable_pitcher':g['teams']['home'].get('probablePitcher'),
              'venue':g.get('venue'),
          }
          pathlib.Path('validation').mkdir(exist_ok=True)
          pathlib.Path('validation/iainvestigadora_real_target_20260820.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit target evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/iainvestigadora_real_target_20260820.json
          git commit -m 'validation: capture real MLB target for @iainvestigadora'
          git push
