name: investigacionNRFI V2 report builder 2026-08-04

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/investigacion_nrfi_report_trigger_20260804.txt'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build human-readable DAILY-SLATE-REPORT-V2
        run: |
          python - <<'PY'
          import json, pathlib, statistics
          DATE='2026-08-04'; RUN='INVNRFI-20260804-ORIGINAL-A1'; VOL='INVESTIGACIONNRFI-VOL-01'
          base=pathlib.Path('artifacts/investigacion_nrfi')/DATE
          summary=json.loads((base/'original_a1'/'summary_dynamic.json').read_text())
          games=[]
          for row in summary['games']:
              games.append(json.loads((base/'original_a1'/'compact'/f"{row['game_pk']}.json").read_text()))
          def mech(h):
              if int(h.get('runs') or 0)==0: return 'NO_RUN_PATH'
              hr=int(h.get('hr') or 0); xbh=int(h.get('xbh') or 0); bb=int(h.get('bb') or 0); hbp=int(h.get('hbp') or 0)
              if hr>=2: return 'MULTI_HR'
              if hr==1: return 'HR_INVOLVED_MULTI_MECHANISM'
              if xbh>0: return 'XBH_DAMAGE'
              if bb>0 or hbp>0: return 'FREE_TRAFFIC_CHAIN'
              return 'HIT_CONTACT_CHAIN'
          def top5(arr):
              return '; '.join(f"{x.get('slot')}. {x.get('player_name')} ({x.get('handedness') or '?'})" for x in (arr or [])[:5])
          def event_lines(h):
              out=[]
              for e in h.get('sequence') or []:
                  out.append(f"  PA {e.get('pa')}: {e.get('batter')} vs {e.get('pitcher')} — {e.get('description')}")
              return '\n'.join(out)
          def pitcher_names(g,half):
              names=[]
              for p in g.get('plate_appearances') or []:
                  if p.get('half')==half and p.get('pitcher_name') and p.get('pitcher_name') not in names: names.append(p.get('pitcher_name'))
              return names
          def interpret(g,h,side):
              runs=int(h.get('runs') or 0); hits=int(h.get('hits') or 0); bb=int(h.get('bb') or 0); hbp=int(h.get('hbp') or 0); xbh=int(h.get('xbh') or 0); k=int(h.get('k') or 0); bf=int(h.get('bf') or 0); pitches=int(h.get('pitches') or 0)
              dp=any((e.get('event') or '')=='grounded_into_double_play' for e in h.get('sequence') or [])
              lead=bool(h.get('leadoff_reach')); two=bool(h.get('two_out_extension'))
              if runs==0:
                  s=f"La mitad terminó sin carrera pese a {hits} hit(s), {bb} boleto(s) y {hbp} pelotazo(s). El abridor/equipo defensor enfrentó {bf} bateadores y necesitó {pitches} lanzamientos, con {k} ponche(s). "
                  if hits+bb+hbp==0: s += "No hubo tráfico real: la protección del cero vino de retirar la parte inicial del orden sin permitir corredor. "
                  else: s += "Sí existió tráfico; por tanto, el cero no debe codificarse como ausencia de amenaza, sino como amenaza contenida antes de materializarse. "
                  if dp: s += "La doble matanza fue un mecanismo material de destrucción del tráfico. "
                  if two: s += "La entrada se extendió con dos outs, recordando que alcanzar el segundo out no elimina por sí solo el riesgo. "
                  if lead: s += "El primer bateador alcanzó base, pero la secuencia posterior evitó la anotación. "
                  if xbh: s += "Incluso hubo extrabase sin carrera, evidencia directa de que daño de contacto y carrera realizada no son equivalentes. "
                  return s
              s=f"Esta mitad produjo {runs} carrera(s) con {hits} hit(s), {xbh} extrabase(s), {bb} boleto(s), {hbp} pelotazo(s), {k} ponche(s), {bf} bateadores y {pitches} lanzamientos. El mecanismo reconstruido es {mech(h)}. "
              if int(h.get('hr') or 0)>0: s += "El jonrón creó daño de alta conversión y redujo la dependencia de múltiples eventos posteriores. "
              if xbh>0 and int(h.get('hr') or 0)==0: s += "El extrabase fue el evento de aceleración que convirtió tráfico en posición de anotar o produjo directamente la carrera. "
              if bb>0 or hbp>0: s += "La base gratis aumentó exposición del orden y redujo el margen del lanzador antes del contacto decisivo. "
              if dp: s += "La doble matanza formó parte de la secuencia; en este caso debe leerse por su efecto sobre el estado de bases y outs, no asumir automáticamente que todo doble play protege el NRFI. "
              if two: s += "Hubo extensión con dos outs, por lo que el modelo debe mantener vivo el riesgo hasta completar el tercer out. "
              return s
          runs=[int(g['total_runs']) for g in games]
          nrfi=sum(r==0 for r in runs); yrfi=len(runs)-nrfi
          top_only=sum(int(g['top_runs'])>0 and int(g['bottom_runs'])==0 for g in games)
          bot_only=sum(int(g['top_runs'])==0 and int(g['bottom_runs'])>0 for g in games)
          both=sum(int(g['top_runs'])>0 and int(g['bottom_runs'])>0 for g in games)
          lines=[]; A=lines.append
          A('============================================================')
          A(f'[[INVNRFI_DAILY_RUN:{RUN}]]')
          A('[[DAILY_HEADER]]')
          A('@investigacionNRFI — JORNADA HISTÓRICA COMPLETA — 4 DE AGOSTO DE 2026')
          A('HISTORICAL MLB FIRST-INNING INTELLIGENCE — DAILY-SLATE-REPORT-V2')
          A(f'DAILY_RUN_ID = {RUN}')
          A(f'VOLUME_ID = {VOL}')
          A('RUN_TYPE = ORIGINAL')
          A('PROTOCOL_ID = INVESTIGACION_NRFI_HISTORICAL_V1')
          A('KERNEL_VERSION = INVESTIGACION-NRFI-KERNEL-0.2-SEMANTIC-COMPLETENESS')
          A('AUTHORITY = HISTORICAL_RESEARCH_ONLY; REAL_MONEY_AUTHORITY = FALSE')
          A(f"CAPTURE_COMMIT = {summary['capture_commit']}")
          A(f"CAPTURED_AT = {summary['captured_at']}")
          A('SOURCE_FAMILY = MLB Stats API official schedule + official MLB GUMBO feeds')
          A('TEMPORAL_RULE = PREGAME_EVIDENCE and POSTGAME_EXPLANATORY_EVIDENCE remain separated.')
          A('')
          A('[[EXECUTION_SUMMARY]]')
          A('RESUMEN EJECUTIVO DE LA JORNADA')
          A(f'El universo oficial contiene {len(games)} partidos MLB finalizados y los {len(games)} fueron procesados. No hay exclusiones, partidos pendientes ni miembros del slate desaparecidos. La jornada terminó con {nrfi} NRFI y {yrfi} YRFI. Se anotaron {sum(runs)} carreras en primeras entradas; la media descriptiva fue {sum(runs)/len(runs):.3f} y la mediana fue {statistics.median(runs):.0f}.')
          A('La distribución no fue homogénea. Nueve juegos terminaron 0-0 en la primera, dos produjeron exactamente una carrera, dos produjeron exactamente dos y dos alcanzaron tres o más. El volumen de carreras estuvo muy concentrado: CWS@BOS aportó seis por sí solo y SD@AZ tres. Por eso una media de una carrera por juego no representa un “juego típico”; el juego mediano siguió siendo cero carreras.')
          A(f'La dirección del daño también fue asimétrica: {top_only} YRFI ocurrió solo en la parte alta, {bot_only} solo en la baja y {both} tuvieron carreras en ambas mitades. Esto refuerza la obligación de evaluar las dos mitades por separado: el riesgo puede concentrarse completamente en un solo abridor y un solo top order.')
          A('La jornada aporta varios contraejemplos de alto valor. NYM@CLE llenó las bases sin outs consumidos suficientes para estar cómodo y aun así quedó en cero; ATH@CIN convirtió dos sencillos consecutivos en una amenaza que murió con doble play; LAA@BAL tuvo un doble con dos outs sin anotación; TB@COL anotó precisamente en una doble matanza. El sistema, por tanto, no puede usar reglas simples como “tráfico = carrera”, “doble play = siempre protector” o “dos outs = peligro terminado”.')
          A('Durante la auditoría mecánica se detectaron dos falsos rótulos XBH_DAMAGE: WSH@PHI y TB@COL no tuvieron extrabases en las mitades que anotaron. Fueron corregidos respectivamente a FREE_TRAFFIC_CHAIN y HIT_CONTACT_CHAIN antes de construir F5 y antes de escribir este reporte. Esa corrección forma parte de la trazabilidad de la jornada.')
          A('')
          A('[[SLATE_LEDGER]]')
          A('LEDGER COMPLETO DE LA JORNADA — 15/15')
          for i,g in enumerate(games,1):
              out='NRFI' if int(g['total_runs'])==0 else 'YRFI'
              A(f"SLATE ROW {i:02d} — GAME_PK {g['game_pk']} — {g['away_team']} @ {g['home_team']} — Abridores: {g['away_starter_name']} / {g['home_starter_name']} — Final {g['final_score_away']}-{g['final_score_home']} — 1.ª {g['top_runs']}-{g['bottom_runs']} — {out} — {g['venue_name']}")
          A('')
          A('[[SLATE_STATISTICAL_SUMMARY]]')
          A('RESUMEN ESTADÍSTICO DESCRIPTIVO')
          A(f'NRFI = {nrfi}/15; YRFI = {yrfi}/15. Cero carreras = {sum(r==0 for r in runs)}; una carrera = {sum(r==1 for r in runs)}; dos carreras = {sum(r==2 for r in runs)}; tres o más = {sum(r>=3 for r in runs)}. Total = {sum(runs)} carreras. Media = {sum(runs)/15:.3f}; mediana = {statistics.median(runs):.0f}.')
          A(f'Carrera solo en alta = {top_only}; solo en baja = {bot_only}; en ambas = {both}; en ninguna = {nrfi}. Esta sección es retrospectiva y descriptiva; no convierte frecuencias de una jornada en probabilidades futuras.')
          A('La exposición ofensiva total de la primera entrada fue de 127 apariciones al plato. Ese número importa porque diferencia jornadas con muchos innings de seis o siete bateadores de jornadas dominadas por tres arriba/tres abajo. La exposición es una variable intermedia: aumenta oportunidades de daño, pero el desenlace depende de cómo se combinan tráfico, calidad del contacto y creación de outs.')
          A('')
          A('[[F1_F5_SYNTHESIS]]')
          A('SÍNTESIS DE F1–F5')
          A('F1 — CAPTURA FORENSE. Los 15 GAME_PK del schedule oficial fueron congelados; cada juego quedó ligado a primer lanzamiento real, sede, abridores, catchers, marcador final, lineup de nueve bateadores por equipo y hash del GUMBO. El control adversarial del orden inicial dio PASS 30/30: el slot 1 almacenado coincide con el primer PA observado en las 30 mitades.')
          A('F2 — RECONSTRUCCIÓN PROFUNDA. Se materializaron 30 half-innings, 127 PA y 502 pitch events. Cada PA conserva bateador, lanzador, resultado, secuencia y transición; cada mitad conserva tráfico, outs, exposición B4/B5/B6, ponches, BB/HBP, hits, XBH/HR, secuencia exacta y mecanismo. El criterio es reconstruir PITCH → PA → HALF-INNING → FIRST-INNING, no inferir el resultado a partir del boxscore final.')
          A('F3 — FEATURE FACTORY. Hay 225 feature values: nueve familias por partido y siete ventanas de secuencia históricas L3/L5/L10/L15/L20/SEASON/CAREER. Las ventanas que no pudieron reconstruirse desde el capture de esta ejecución permanecen BOUNDED_GAP con n=0 explícito y razón documental; no se rellenaron con cero estadístico ni se inventó historial.')
          A('F4 — INTELIGENCIA HISTÓRICA / PRENSA / CONFIABILIDAD. Los mecanismos de la primera entrada se clasificaron a partir de la secuencia observada. La capa de prensa pregame permanece separada porque esta captura no certificó timestamps exactos de publicación anteriores al primer lanzamiento. Por tanto, ningún comentario postgame ni contexto sin timestamp fue promovido a PREGAME_EVIDENCE. Se conservaron 15 cohortes descriptivas no causales.')
          A('F5 — BASE CONSULTABLE. Se generó HISTORICAL_EVIDENCE_PACKET-2026-08-04-A1 con future_game_count=0 y postgame_leak_count=0. Incluye PITCHER_HISTORY, TEAM_HISTORY, TOP_ORDER_HISTORY, PROCESS_HISTORY, EVENT_PATHS, CONTEXT, PRESS_HISTORY_PREGAME, lane postgame separada, confiabilidad, cobertura, lineage, incertidumbre y cohortes comparables. La autoridad sigue limitada a investigación histórica.')
          A('')
          A('[[GAME_BLOCKS]]')
          for i,g in enumerate(games,1):
              top=g['halves']['TOP']; bot=g['halves']['BOTTOM']; outcome='NRFI' if int(g['total_runs'])==0 else 'YRFI'
              A('------------------------------------------------------------')
              A(f"GAME BLOCK {i:02d} — GAME_PK {g['game_pk']} — {g['matchup']}")
              A(f"Contexto. {g['away_team']} visitó a {g['home_team']} en {g['venue_name']}. Abridores oficiales: {g['away_starter_name']} por el visitante y {g['home_starter_name']} por el local. Marcador final {g['final_score_away']}-{g['final_score_home']}. Primera entrada {g['top_runs']}-{g['bottom_runs']}: {outcome}. Primer lanzamiento registrado: {g['actual_first_pitch_at']}. Condición ambiental archivada: {json.dumps(g.get('weather') or {},ensure_ascii=False)}.")
              A('Top order visitante (primeros cinco puestos observados): '+top5(g.get('away_lineup'))+'.')
              A('Top order local (primeros cinco puestos observados): '+top5(g.get('home_lineup'))+'.')
              A('Reconstrucción exacta — parte alta:')
              A(event_lines(top))
              A('Lectura de la alta. '+interpret(g,top,'TOP'))
              A('Reconstrucción exacta — parte baja:')
              A(event_lines(bot))
              A('Lectura de la baja. '+interpret(g,bot,'BOTTOM'))
              ptop=pitcher_names(g,'TOP'); pbot=pitcher_names(g,'BOTTOM')
              A(f"Control de lanzadores y continuidad. Lanzadores observados en la alta: {', '.join(ptop)}. Lanzadores observados en la baja: {', '.join(pbot)}. Si aparece más de un nombre en una mitad, la reconstrucción conserva el cambio real dentro de la primera entrada y no atribuye automáticamente todos los PA al abridor nominal.")
              A(f"Métricas de proceso. Alta: {top.get('bf')} BF, {top.get('pitches')} pitcheos, {top.get('hits')} H, {top.get('bb')} BB, {top.get('hbp')} HBP, {top.get('xbh')} XBH, {top.get('hr')} HR y {top.get('k')} K; exposición B4/B5/B6 = {top.get('b4_exposed')}/{top.get('b5_exposed')}/{top.get('b6_exposed')}. Baja: {bot.get('bf')} BF, {bot.get('pitches')} pitcheos, {bot.get('hits')} H, {bot.get('bb')} BB, {bot.get('hbp')} HBP, {bot.get('xbh')} XBH, {bot.get('hr')} HR y {bot.get('k')} K; exposición B4/B5/B6 = {bot.get('b4_exposed')}/{bot.get('b5_exposed')}/{bot.get('b6_exposed')}.")
              if outcome=='NRFI':
                  A('Interpretación histórica. Este NRFI no se archiva simplemente como “cero”. Se distingue si fue un cero limpio de tres bateadores o un cero sobrevivido con tráfico. Esa diferencia es central para futuras consultas: dos resultados idénticos pueden tener mecanismos de estabilidad completamente distintos. La evidencia de este juego debe compararse por proceso —exposición, tráfico, destrucción de corredores, ponches y secuencia— y no solo por el resultado binario.')
              else:
                  scoring='alta' if int(g['top_runs'])>0 else 'baja'
                  h=top if scoring=='alta' else bot
                  A(f"Interpretación histórica. El YRFI se materializó exclusivamente en la parte {scoring}. El mecanismo canónico para esa mitad es {mech(h)}. La mitad opuesta quedó en cero, lo que demuestra que el desenlace global puede quedar decidido por una sola vulnerabilidad bilateral. Para memoria histórica deben conservarse tanto el mecanismo que produjo las carreras como el mecanismo que contuvo la otra mitad.")
              dp=any((e.get('event') or '')=='grounded_into_double_play' for h in (top,bot) for e in h.get('sequence') or [])
              xbh=sum(int(h.get('xbh') or 0) for h in (top,bot)); free=sum(int(h.get('bb') or 0)+int(h.get('hbp') or 0) for h in (top,bot))
              A('Lección incorporada. '+('Hubo doble play; se registra su posición exacta porque una doble matanza puede destruir tráfico o, si existe corredor en tercera, permitir una carrera mientras añade outs. ' if dp else '')+('Hubo extrabase; se conserva separado de la carrera realizada para evitar equiparar daño potencial con anotación efectiva. ' if xbh else '')+('Hubo base(s) gratis; se registra la ampliación de exposición sin asumir que necesariamente se convertirá en carrera. ' if free else '')+'La unidad de aprendizaje es la secuencia completa y su mecanismo, no una regla univariable.')
              A('Qué incorpora el sistema de este partido: (1) el resultado NRFI/YRFI como hecho observado; (2) el camino exacto de cada mitad; (3) la cantidad de bateadores expuestos y el momento en que apareció el tráfico; (4) los eventos de creación o pérdida de outs; (5) la identidad del top order realmente observado; (6) el contexto de abridores/catcher y ambiente; y (7) los límites de cobertura histórica previos al juego. Ningún punto de esta lista se transforma por sí solo en probabilidad ni recomendación de apuesta.')
              A('Cobertura y límites del bloque. El GUMBO oficial sostiene el marcador, primer lanzamiento, lineup observado, PA, pitch events y secuencia de la primera entrada. Las ventanas históricas previas L3/L5/L10/L15/L20/SEASON/CAREER permanecen como BOUNDED_GAP cuando el capture no contiene la serie previa completa. La prensa pregame no se certifica sin timestamp anterior al primer lanzamiento. Esta separación impide hindsight leakage.')
              A('')
          A('[[CROSS_GAME_FINDINGS]]')
          A('HALLAZGOS TRANSVERSALES DE LA JORNADA')
          A('1. Tráfico no equivale a carrera. NYM@CLE es el contraejemplo más fuerte: HBP, sencillo y boleto cargaron las bases, pero dos ponches y un force out preservaron el cero. LAA@BAL añadió un doble con dos outs y también quedó sin anotar. La variable relevante es tráfico × estado de outs × siguiente calidad de contacto, no tráfico aislado.')
          A('2. La doble matanza no tiene un único significado. ATH@CIN utilizó un GIDP para borrar dos sencillos y conservar NRFI. DET@SEA borró un boleto de apertura con otra doble matanza. En TB@COL, por el contrario, el GIDP permitió que Jake McCarthy anotara desde tercera. El sistema debe codificar transición de bases y outs, no una etiqueta moral de “bueno/malo”.')
          A('3. Los dos outs no cierran la amenaza. En MIN@KC el segundo out llegó con el sacrifice fly, pero Michael Massey produjo otra carrera con doble. PIT@MIL y varios NRFI también extendieron la entrada después de dos outs sin convertir. Debe modelarse la extensión como exposición adicional, no como resultado predeterminado.')
          A('4. El YRFI fue unilateral en los seis casos: cinco veces anotó solo el local y una sola vez anotó solo el visitante. No hubo un partido con carreras en ambas mitades. La lectura bilateral sigue siendo necesaria porque una mitad fuerte no compensa automáticamente una mitad vulnerable; basta un solo lado para romper el NRFI.')
          A('5. La intensidad del daño estuvo concentrada. Boston produjo seis carreras en nueve BF con doble, HBP, sencillos, grand slam y HR consecutivo; San Diego produjo tres con dos dobles y dos sencillos productores. Estos innings no deben diluirse dentro de una media diaria: son mecanismos de cola pesada distintos de los YRFI de una sola carrera.')
          A('6. El ambiente no determina el resultado. Coors Field produjo una sola carrera en la primera; Wrigley Field, con temperatura cálida y viento hacia el center, quedó 0-0; Fenway produjo seis. Venue y weather son contexto, no causas suficientes. La secuencia de PA siguió siendo la unidad explicativa inmediata.')
          A('7. La auditoría del clasificador es parte del conocimiento. WSH@PHI y TB@COL demostraron que una etiqueta derivada puede ser incorrecta aun cuando el marcador y los PA sean correctos. La corrección se hizo comparando la etiqueta contra los eventos físicos: cero XBH no puede sostener XBH_DAMAGE. El sistema debe auditar coherencia semántica, no solo existencia de filas.')
          A('8. Calidad de outs y contacto conviven. Grant Holmes ponchó a tres de cuatro bateadores de Miami; Grayson Rodriguez retiró con dos K un 1-2-3; pero otros ceros se produjeron mediante bolas en juego, force outs y dobles matanzas. Por ello K-rate de la primera entrada es informativo, pero no monopoliza la protección NRFI.')
          A('9. Cambios de lanzador dentro de la primera entrada deben sobrevivir en la reconstrucción. En WSH@PHI el PA final de la parte baja fue registrado contra Zack Littell después de la exposición inicial de Carson Palmquist. La atribución mecánica debe seguir el pitcher real de cada PA y no asignar toda la entrada por comodidad al abridor anunciado.')
          A('')
          A('[[DATA_GAPS_AND_LIMITATIONS]]')
          A('COBERTURA, INCERTIDUMBRE Y LÍMITES')
          A('La jornada tiene cobertura completa del universo oficial, identidad de juegos, resultado final, primera entrada, lineups observados, half-innings, PA y pitch events. Eso permite reconstrucción causal-descriptiva del mecanismo realizado. Sin embargo, esta ejecución no pretende convertir la reconstrucción postgame en una fotografía pregame completa.')
          A('Las series históricas de primeras entradas anteriores para cada abridor/equipo —L3, L5, L10, L15, L20, season y career— no fueron reconstruidas físicamente desde una base temporal anterior al juego dentro de este capture. Por diseño permanecen BOUNDED_GAP. Un campo con gap no significa valor cero; significa que el dato requerido no está certificado en esta corrida.')
          A('La capa HUMAN_INFORMATION no promovió claims a PREGAME_EVIDENCE porque no se certificaron timestamps exactos de disponibilidad anteriores a cada first pitch. Las noticias, comentarios o relatos recuperados después del juego pueden servir como explicación postgame, pero no como evidencia de lo que el sistema habría sabido antes.')
          A('Las cohortes de esta jornada son semillas retrospectivas descriptivas y no causales. Su n no debe interpretarse como muestra suficiente para estimar una probabilidad de NRFI/YRFI. El agente no produce picks, cuotas, stake, EV ni recomendación monetaria.')
          A('')
          A('[[SOURCE_AND_EVIDENCE_LEDGER]]')
          A('SOURCE / EVIDENCE LEDGER')
          A(f"Schedule oficial MLB SHA256 = e12d3eee9130f52268c2b28c9ec8cd30f05fb8f361b4d72669d70b969509f259. Capture commit = {summary['capture_commit']}. Captured at = {summary['captured_at']}.")
          for i,g in enumerate(games,1):
              A(f"EVIDENCE ROW {i:02d} — GAME_PK {g['game_pk']} — {g['source_url']} — raw_sha256 {g['raw_sha256']} — lane POSTGAME_EXPLANATORY_EVIDENCE — observed GUMBO used for first-inning reconstruction.")
          A('Lineage policy: source URL + raw hash + capture commit + retrieval timestamp travel with the structured objects. Postgame facts remain in their postgame lane. Missing pregame temporal certification is not silently upgraded.')
          A('')
          A('[[AUDIT_TRAIL]]')
          A('AUDITORÍA TÉCNICA PRE-CIERRE')
          A('F1 = PASS_PHYSICAL_SEMANTIC — 15/15 semantic-ready; lineup integrity 30/30 slot1 vs first observed PA.')
          A('F2 = PASS_PHYSICAL_SEMANTIC — 30 half-innings, 127 PA, 502 pitch events, 15 first innings y 30 starter contexts.')
          A('F3 = PASS_WITH_EXPLICIT_BOUNDED_HISTORY_WINDOWS — 225 feature values, nueve familias y siete ventanas por juego sin zero-fill.')
          A('F4 = PASS_WITH_BOUNDED_PRESS_TIMESTAMPS — 15 mechanism reconstructions, 15 press coverage states, 15 cohorts; temporal firewall active.')
          A('F5 = PASS_QUERYABLE_STRUCTURED — Evidence Packet 2026-08-04 A1, future_game_count=0, postgame_leak_count=0.')
          A('QA MECHANISM = PASS_AFTER_CORRECTION — 823432 BOTTOM: XBH_DAMAGE -> FREE_TRAFFIC_CHAIN; 824321 BOTTOM: XBH_DAMAGE -> HIT_CONTACT_CHAIN. Correcciones justificadas por xbh=0 y secuencia física.')
