name: investigacionNRFI V2 report builder 2026-08-05

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/investigacion_nrfi_report_trigger_20260805.txt'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build human-readable DAILY-SLATE-REPORT-V2
        run: |
          python - <<'PY'
          import json, pathlib, statistics
          DATE='2026-08-05'; RUN='INVNRFI-20260805-ORIGINAL-A1'; VOL='INVESTIGACIONNRFI-VOL-01'
          base=pathlib.Path('artifacts/investigacion_nrfi')/DATE
          root=base/'original_a1'
          summary=json.loads((root/'summary_dynamic.json').read_text())
          games=[json.loads((root/'compact'/f"{r['game_pk']}.json").read_text()) for r in summary['games']]
          def mech(h):
              if int(h.get('runs') or 0)==0: return 'NO_RUN_PATH'
              hr=int(h.get('hr') or 0); xbh=int(h.get('xbh') or 0); free=int(h.get('bb') or 0)+int(h.get('hbp') or 0)+int(h.get('roe') or 0)
              if hr>=2:return 'MULTI_HR'
              if hr==1 and int(h.get('runs') or 0)==1:return 'SOLO_HR'
              if hr>0:return 'HR_INVOLVED_MULTI_MECHANISM'
              if xbh>0:return 'XBH_DAMAGE'
              if free>0:return 'FREE_TRAFFIC_CHAIN'
              return 'HIT_CONTACT_CHAIN'
          def top5(a): return '; '.join(f"{x['slot']}. {x['player_name']} ({x.get('handedness') or '?'})" for x in a[:5])
          def events(h): return '\n'.join(f"  PA {e.get('pa')}: {e.get('batter')} vs {e.get('pitcher')} — {e.get('description')}" for e in h.get('sequence') or [])
          def pitcher_names(g,half):
              z=[]
              for p in g.get('plate_appearances') or []:
                  if p.get('half')==half and p.get('pitcher_name') and p.get('pitcher_name') not in z:z.append(p.get('pitcher_name'))
              return ', '.join(z) or 'NO IDENTIFICADO'
          def process(g,pid):
              p=(g.get('pitcher_process') or {}).get(str(pid),{})
              if not p:return 'sin métricas de proceso adicionales certificadas'
              mix=', '.join(f"{k}:{v}" for k,v in sorted((p.get('pitch_mix_first_inning') or {}).items())) or 'sin mix'
              return f"{p.get('pitch_count_first_inning',0)} pitcheos; swings {p.get('swings',0)}; whiffs {p.get('whiffs',0)}; contactos {p.get('contacts',0)}; velocidad media {p.get('avg_release_speed_first_inning','NA')} mph; mix {mix}"
          def read_half(h):
              r=int(h.get('runs') or 0); bf=int(h.get('bf') or 0); hits=int(h.get('hits') or 0); bb=int(h.get('bb') or 0); hbp=int(h.get('hbp') or 0); xbh=int(h.get('xbh') or 0); hr=int(h.get('hr') or 0); k=int(h.get('k') or 0); pit=int(h.get('pitches') or 0)
              dp=any((e.get('event') or '')=='grounded_into_double_play' for e in h.get('sequence') or [])
              s=f"{bf} bateadores, {pit} lanzamientos, {hits} H, {bb} BB, {hbp} HBP, {xbh} XBH, {hr} HR y {k} K. "
              if r==0:
                  s+=f"La mitad terminó sin carrera. {'Hubo tráfico y tuvo que ser contenido' if hits+bb+hbp else 'No hubo tráfico material'}; el cero se clasifica por proceso y no como simple resultado binario. "
                  if h.get('leadoff_reach'):s+='El primer bateador alcanzó y la secuencia posterior evitó la conversión. '
                  if h.get('two_out_extension'):s+='Hubo extensión después de dos outs, por lo que el tercer out siguió siendo material. '
                  if dp:s+='La doble matanza funcionó aquí como destructor de tráfico. '
                  if xbh:s+='Existió extrabase sin anotación, separando daño potencial de carrera realizada. '
              else:
                  s+=f"Produjo {r} carrera(s) y el mecanismo reconstruido es {mech(h)}. "
                  if hr:s+='El HR redujo la dependencia de una cadena larga de eventos. '
                  if xbh and not hr:s+='El extrabase aceleró el movimiento de corredores y la conversión del tráfico. '
                  if bb+hbp:s+='La base gratis amplió la exposición del orden. '
                  if h.get('two_out_extension'):s+='La anotación/amenaza sobrevivió a dos outs; el inning no podía darse por terminado antes del tercero. '
                  if dp:s+='La doble matanza debe leerse por la transición exacta de bases/outs, no como evento universalmente protector. '
              return s
          runs=[int(g['total_runs']) for g in games]; nrfi=sum(x==0 for x in runs); yrfi=len(games)-nrfi
          top_only=sum(int(g['top_runs'])>0 and int(g['bottom_runs'])==0 for g in games); bot_only=sum(int(g['top_runs'])==0 and int(g['bottom_runs'])>0 for g in games); both=sum(int(g['top_runs'])>0 and int(g['bottom_runs'])>0 for g in games)
          L=[]; A=L.append
          A('============================================================');A(f'[[INVNRFI_DAILY_RUN:{RUN}]]');A('[[DAILY_HEADER]]')
          A('@investigacionNRFI — JORNADA HISTÓRICA COMPLETA — 5 DE AGOSTO DE 2026')
          A('HISTORICAL MLB FIRST-INNING INTELLIGENCE — DAILY-SLATE-REPORT-V2')
          A(f'DAILY_RUN_ID = {RUN}');A(f'VOLUME_ID = {VOL}');A('RUN_TYPE = ORIGINAL');A('PROTOCOL_ID = INVESTIGACION_NRFI_HISTORICAL_V1');A('KERNEL_VERSION = INVESTIGACION-NRFI-KERNEL-0.2-SEMANTIC-COMPLETENESS');A('AUTHORITY = HISTORICAL_RESEARCH_ONLY; REAL_MONEY_AUTHORITY = FALSE');A(f"CAPTURE_COMMIT = {summary['capture_commit']}");A(f"CAPTURED_AT = {summary['captured_at']}");A('TEMPORAL_RULE = PREGAME_EVIDENCE and POSTGAME_EXPLANATORY_EVIDENCE remain separated.');A('')
          A('[[EXECUTION_SUMMARY]]');A('RESUMEN EJECUTIVO DE LA JORNADA')
          A(f'El universo oficial contiene {len(games)} juegos finalizados y los {len(games)} fueron procesados, sin exclusiones ni pendientes. Resultado descriptivo: {nrfi} NRFI y {yrfi} YRFI. Las primeras entradas produjeron {sum(runs)} carreras; media {sum(runs)/len(runs):.3f}, mediana {statistics.median(runs):.0f}.')
          A(f'Distribución: cero carreras {sum(x==0 for x in runs)}, una {sum(x==1 for x in runs)}, dos {sum(x==2 for x in runs)}, tres o más {sum(x>=3 for x in runs)}. La jornada fue de baja producción agregada, pero no uniforme: hubo {top_only} YRFI solo en la alta, {bot_only} solo en la baja y {both} con carreras en ambas mitades.')
          A('El caso bilateral más importante fue LAD@CHC: Shohei Ohtani abrió el juego con HR y Pete Crow-Armstrong respondió con HR en la baja. El mismo partido demuestra que una mitad aparentemente favorable no protege a la otra y que el riesgo de ambas debe modelarse independientemente.')
          A('TOR@HOU aporta el contraejemplo opuesto: Houston generó boleto, sencillo y otro boleto en la baja, extendiendo la exposición hasta el sexto bateador, pero no convirtió. La lección no es “tráfico no importa”, sino que tráfico, estado de outs y siguiente contacto deben permanecer separados hasta observar la conversión.')
          A('La auditoría mecánica no detectó etiquetas imposibles: ningún XBH_DAMAGE carecía de XBH, ningún SOLO_HR carecía de HR y ningún NO_RUN_PATH contenía carreras. Por tanto F4 se conserva sin correcciones de clasificación en esta jornada.')
          A('')
          A('[[SLATE_LEDGER]]');A('LEDGER COMPLETO DE LA JORNADA — 15/15')
          for i,g in enumerate(games,1):
              outcome='NRFI' if int(g['total_runs'])==0 else 'YRFI'
              A(f"SLATE ROW {i:02d} — GAME_PK {g['game_pk']} — {g['away_team']} @ {g['home_team']} — Abridores: {g['away_starter_name']} / {g['home_starter_name']} — Final {g['final_score_away']}-{g['final_score_home']} — 1.ª {g['top_runs']}-{g['bottom_runs']} — {outcome} — {g['venue_name']}")
          A('');A('[[SLATE_STATISTICAL_SUMMARY]]');A('RESUMEN ESTADÍSTICO DESCRIPTIVO')
          A(f'NRFI={nrfi}/15; YRFI={yrfi}/15; total carreras={sum(runs)}; media={sum(runs)/15:.3f}; mediana={statistics.median(runs):.0f}; 0R={sum(x==0 for x in runs)}; 1R={sum(x==1 for x in runs)}; 2R={sum(x==2 for x in runs)}; 3+R={sum(x>=3 for x in runs)}.')
          A(f'Scoring halves: top-only={top_only}; bottom-only={bot_only}; both={both}; neither={nrfi}. Exposición total: {sum(len(g.get("plate_appearances") or []) for g in games)} PA y {sum(len(g.get("pitch_events") or []) for g in games)} pitch events. Estas frecuencias son retrospectivas, no probabilidades futuras.')
          A('');A('[[F1_F5_SYNTHESIS]]');A('SÍNTESIS F1–F5')
          A('F1 — PASS_PHYSICAL_SEMANTIC. 15 GAME_PK, primer lanzamiento real, sede, abridores, catchers, marcador final y 270 entradas de lineup. Control adversarial del orden: PASS 30/30 slot 1 contra primer PA observado. Lineage ligado al capture commit específico del 5 de agosto.')
          A('F2 — PASS_PHYSICAL_SEMANTIC. Se materializaron 30 half-innings, 121 PA, 494 pitch events, 15 primeras entradas y 30 contextos de abridor. Se preserva PITCH → PA → HALF-INNING → FIRST-INNING y la secuencia exacta de eventos.')
          A('F3 — PASS_WITH_EXPLICIT_BOUNDED_HISTORY_WINDOWS. Se materializaron 225 feature values: nueve familias por juego y las siete ventanas L3/L5/L10/L15/L20/SEASON/CAREER como BOUNDED_GAP cuando la historia previa completa no forma parte del capture. No hubo zero-fill.')
          A('F4 — PASS_WITH_BOUNDED_PRESS_TIMESTAMPS. Quince mecanismos fueron reconstruidos y auditados; 15 estados de prensa y 15 cohortes descriptivas quedaron persistidos. Ningún claim sin timestamp pre-first-pitch fue promovido a PREGAME_EVIDENCE.')
          A('F5 — PASS_QUERYABLE_STRUCTURED. HISTORICAL_EVIDENCE_PACKET-2026-08-05-A1 contiene las 13 dimensiones exigidas, future_game_count=0 y postgame_leak_count=0. Autoridad: investigación histórica únicamente.')
          A('');A('[[GAME_BLOCKS]]')
          for i,g in enumerate(games,1):
              top=g['halves']['TOP']; bot=g['halves']['BOTTOM']; outcome='NRFI' if int(g['total_runs'])==0 else 'YRFI'
              A('------------------------------------------------------------');A(f"GAME BLOCK {i:02d} — GAME_PK {g['game_pk']} — {g['matchup']}")
              A(f"Contexto. {g['away_team']} visitó a {g['home_team']} en {g['venue_name']}. Abridores oficiales: {g['away_starter_name']} / {g['home_starter_name']}. Final {g['final_score_away']}-{g['final_score_home']}. Primera entrada {g['top_runs']}-{g['bottom_runs']}: {outcome}. Primer lanzamiento {g['actual_first_pitch_at']}. Ambiente archivado: {json.dumps(g.get('weather') or {},ensure_ascii=False)}.")
              A('Top order visitante: '+top5(g['away_lineup']));A('Top order local: '+top5(g['home_lineup']))
              A('Reconstrucción exacta — parte alta:');A(events(top));A('Lectura de la alta. '+read_half(top))
              A('Reconstrucción exacta — parte baja:');A(events(bot));A('Lectura de la baja. '+read_half(bot))
              A(f"Continuidad de lanzadores. Alta: {pitcher_names(g,'TOP')}. Baja: {pitcher_names(g,'BOTTOM')}. Se conserva el pitcher real de cada PA, incluso si existe relevo dentro de la primera entrada.")
              A(f"Proceso del abridor visitante {g['away_starter_name']}: {process(g,g['away_starter_id'])}. Proceso del abridor local {g['home_starter_name']}: {process(g,g['home_starter_id'])}.")
              A(f"Diagnóstico de exposición. Alta B4/B5/B6={top.get('b4_exposed')}/{top.get('b5_exposed')}/{top.get('b6_exposed')}; baja={bot.get('b4_exposed')}/{bot.get('b5_exposed')}/{bot.get('b6_exposed')}. La exposición se registra porque llegar al cuarto, quinto o sexto bateador cambia el número de oportunidades sin equivaler automáticamente a carrera.")
              if int(g['total_runs'])==0:
                  A('Interpretación histórica. Este NRFI se archiva por mecanismo. Se distingue un cero limpio de un cero sobrevivido con corredores; esa diferencia permite que futuras consultas comparen estabilidad del proceso y no solo el resultado final.')
              else:
                  sides=[]
                  if int(g['top_runs'])>0:sides.append('alta='+mech(top))
                  if int(g['bottom_runs'])>0:sides.append('baja='+mech(bot))
                  A('Interpretación histórica. El YRFI se explica por '+', '.join(sides)+'. El juego conserva también la mitad que no anotó, porque una lectura bilateral completa necesita el mecanismo de fallo y el de contención.')
              A('Lección incorporada. Se conservan por separado tráfico, daño, outs, exposición, bases gratis, XBH/HR y secuencia. Ninguna variable individual se convierte en regla determinista ni en recomendación monetaria.')
              A('Qué aprende la base de este partido: resultado observado; camino exacto de ambas mitades; identidad del top order; pitcher real por PA; exposición B4/B5/B6; transición de tráfico y outs; proceso de pitcheo disponible; contexto de sede/ambiente; y límites de cobertura histórica. La memoria es consultable, no predictiva por sí sola.')
              A('Cobertura y límites. GUMBO oficial sostiene lineup observado, primer lanzamiento, PA, pitch events, score y secuencia. Historiales previos L3/L5/L10/L15/L20/SEASON/CAREER permanecen BOUNDED_GAP cuando no fueron reconstruidos en este capture. La prensa pregame permanece vacía sin timestamp certificable anterior al primer lanzamiento.')
          A('');A('[[CROSS_GAME_FINDINGS]]');A('HALLAZGOS TRANSVERSALES')
          A('1. LAD@CHC produjo carreras en ambas mitades mediante HR solitarios: Ohtani en la alta y Pete Crow-Armstrong en la baja. Es evidencia bilateral directa: dos mecanismos independientes pueden romper el mismo NRFI.')
          A('2. TOR@HOU quedó 0-0 pese a que Houston acumuló boleto + sencillo + boleto y expuso seis bateadores. Tráfico severo no equivale a carrera; debe combinarse con outs y contacto posterior.')
          A('3. WSH@PHI anotó después de alcanzar dos outs: HBP, sencillo, popout, K y luego sencillo productor de Keibert Ruiz. Dos outs reducen margen, pero no extinguen el riesgo.')
          A('4. CWS@BOS también convirtió con dos outs: K, flyout, sencillo de Wilyer Abreu y sencillo productor de Willson Contreras. La extensión tardía puede ser suficiente sin XBH ni base gratis.')
          A('5. TB@COL mostró aceleración por XBH: triple de Victor Mesa Jr., sencillo productor, boleto y otro sencillo productor. El triple abrió el mecanismo, pero la segunda carrera requirió continuidad de tráfico.')
          A('6. ATH@CIN resolvió el YRFI en un solo swing: Lawrence Butler abrió con HR. Después hubo boleto, pero no más carreras. El sistema distingue evento de alta conversión de la exposición posterior.')
          A('7. La jornada terminó 10/15 NRFI y mediana cero, pero ese agregado no debe ocultar los cinco mecanismos YRFI ni transformarse en probabilidad futura. La distribución diaria es descriptiva.')
          A('8. QA mecánico sin correcciones: todas las etiquetas pasaron las reglas de coherencia contra runs/XBH/HR/free traffic. El clasificador no se acepta por autoridad; se valida contra la secuencia física cada día.')
          A('9. Contexto ambiental no es causa suficiente. Coors produjo dos carreras en la alta; otros entornos terminaron sin carrera. Venue/weather se conserva como contexto y nunca sustituye la secuencia de PA.')
          A('');A('[[DATA_GAPS_AND_LIMITATIONS]]');A('COBERTURA Y LIMITACIONES')
          A('Cobertura completa: 15/15 juegos, 270 lineup entries, 30 half-innings, 121 PA, 494 pitch events, 15 first innings, 30 starter contexts, 225 feature values y 15 cohortes. Las ventanas históricas previas permanecen explícitamente acotadas cuando no están en el capture.')
          A('HUMAN_INFORMATION: no se promovió ningún claim a PREGAME_EVIDENCE porque no se certificaron timestamps exactos de disponibilidad anteriores al primer lanzamiento. Los hechos observados postgame permanecen en POSTGAME_EXPLANATORY_EVIDENCE.')
          A('Las cohortes son retrospectivas, descriptivas y pequeñas. No autorizan inferencia causal, pick, stake, odds, EV ni probabilidad forzada.')
          A('');A('[[SOURCE_AND_EVIDENCE_LEDGER]]');A('SOURCE / EVIDENCE LEDGER')
          A(f"Schedule SHA256 = 8abf2b1933f0c0f6d11c1695308013f0955ab145deb24e3e27cb591c6225e93f. Capture commit = {summary['capture_commit']}. Captured at = {summary['captured_at']}.")
          for i,g in enumerate(games,1):A(f"EVIDENCE ROW {i:02d} — GAME_PK {g['game_pk']} — {g['source_url']} — raw_sha256 {g['raw_sha256']} — POSTGAME_EXPLANATORY_EVIDENCE — official GUMBO first-inning reconstruction.")
          A('Lineage policy: URL, raw hash, capture commit y retrieval timestamp permanecen ligados al objeto estructurado. Missing pregame certification is never silently upgraded.')
          A('');A('[[AUDIT_TRAIL]]');A('AUDITORÍA TÉCNICA PRE-CIERRE')
          A('F1=PASS_PHYSICAL_SEMANTIC — 15/15; lineup integrity 30/30.')
          A('F2=PASS_PHYSICAL_SEMANTIC — 30 half-innings, 121 PA, 494 pitch events, 15 first innings, 30 starter contexts.')
          A('F3=PASS_WITH_EXPLICIT_BOUNDED_HISTORY_WINDOWS — 225 feature values; 9 familias y 7 ventanas por juego sin zero-fill.')
          A('F4=PASS_WITH_BOUNDED_PRESS_TIMESTAMPS — 15 mecanismos, 15 press coverage states, 15 cohortes; mechanism QA PASS_NO_CORRECTIONS.')
          A('F5=PASS_QUERYABLE_STRUCTURED — HISTORICAL_EVIDENCE_PACKET-2026-08-05-A1; 13/13 keys; future_game_count=0; postgame_leak_count=0.')
          A('REPORT CONTRACT STATE=PENDING_PHYSICAL_READBACK. No se certifica cierre terminal hasta escribir este bloque en Drive y releerlo físicamente.')
          A('');A('[[DAILY_CLOSURE]]');A('CIERRE DE CONTENIDO — PENDIENTE DE CERTIFICACIÓN TERMINAL')
          A('Los 15 juegos oficiales están procesados y F1–F5 materializados. READBACK PASS, REPORT_CONTRACT PASS, FINAL_AUDIT PASS, DRIVE_APPEND_VERIFIED y CORE_MISSION_COMPLETE solo se declararán después del gate físico del documento continuo.')
          A(f'[[END_INVNRFI_DAILY_RUN:{RUN}]]');A('============================================================')
          text='\n'.join(L)+'\n'
          markers=['DAILY_HEADER','EXECUTION_SUMMARY','SLATE_LEDGER','SLATE_STATISTICAL_SUMMARY','F1_F5_SYNTHESIS','GAME_BLOCKS','CROSS_GAME_FINDINGS','DATA_GAPS_AND_LIMITATIONS','SOURCE_AND_EVIDENCE_LEDGER','AUDIT_TRAIL','DAILY_CLOSURE']
          meta={'characters':len(text),'bytes':len(text.encode()),'game_blocks':text.count('GAME BLOCK '),'slate_rows':text.count('SLATE ROW '),'required_markers':{m:(f'[[{m}]]' in text) for m in markers}}
          if meta['characters']<45000:raise SystemExit(f'REPORT_TOO_SHORT {meta}')
          if meta['game_blocks']!=15 or meta['slate_rows']!=15 or not all(meta['required_markers'].values()):raise SystemExit(f'REPORT_CONTRACT_FAIL {meta}')
          (root/'report_v2.txt').write_text(text,encoding='utf-8');(root/'report_v2_meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta))
          PY
      - name: Persist report package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/investigacion_nrfi/2026-08-05/original_a1/report_v2.txt artifacts/investigacion_nrfi/2026-08-05/original_a1/report_v2_meta.json
          git diff --cached --quiet || git commit -m 'Build DAILY-SLATE-REPORT-V2 for investigacionNRFI 2026-08-05'
          git push
