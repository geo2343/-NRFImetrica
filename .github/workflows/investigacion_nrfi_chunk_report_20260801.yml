name: investigacionNRFI chunk repair report 2026-08-01

on:
  push:
    paths:
      - 'docs/investigacion_nrfi_chunk_trigger_20260801.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split report exactly by character count
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('artifacts/investigacion_nrfi/2026-08-01/repair_a1')
          text=(root/'daily_report.md').read_text(encoding='utf-8')
          size=6000
          chunks=[text[i:i+size] for i in range(0,len(text),size)]
          out=root/'report_chunks'; out.mkdir(exist_ok=True)
          for old in out.glob('*.txt'): old.unlink()
          for i,c in enumerate(chunks,1):
              (out/f'{i:02d}.txt').write_text(c,encoding='utf-8')
          manifest={'count':len(chunks),'total_characters':sum(len(x) for x in chunks),'source_characters':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest(),'chunk_size':size}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          assert ''.join(chunks)==text
          assert manifest['total_characters']==manifest['source_characters']
          assert max(map(len,chunks))<=size
          print(manifest)
          PY
      - name: Persist chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/investigacion_nrfi/2026-08-01/repair_a1/report_chunks
          git diff --cached --quiet || git commit -m 'Persist Drive-safe report chunks for investigacionNRFI repair A1'
          git push
