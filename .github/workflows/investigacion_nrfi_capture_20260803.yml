name: investigacionNRFI official capture 2026-08-03

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/investigacion_nrfi_capture_trigger_20260803.txt'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze official slate and fetch MLB GUMBO feeds
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request
          DATE='2026-08-03'
          ua={'User-Agent':'Mozilla/5.0 @investigacionNRFI/1.1'}
          sched='https://statsapi.mlb.com/api/v1/schedule?'+urllib.parse.urlencode({'sportId':1,'date':DATE,'hydrate':'team,venue,probablePitcher,linescore'})
          with urllib.request.urlopen(urllib.request.Request(sched,headers=ua),timeout=60) as r:
              schedule_body=r.read()
          s=json.loads(schedule_body)
          games=[]
          for d in s.get('dates',[]):
              for g in d.get('games',[]):
                  status=((g.get('status') or {}).get('abstractGameState') or '').lower()
                  detailed=((g.get('status') or {}).get('detailedState') or '').lower()
                  if status!='final' and 'final' not in detailed and 'completed' not in detailed:
                      raise SystemExit(f'NONFINAL_GAME_IN_HISTORICAL_SLATE {g.get("gamePk")} {status} {detailed}')
                  away=((g.get('teams') or {}).get('away') or {}).get('team') or {}
                  home=((g.get('teams') or {}).get('home') or {}).get('team') or {}
                  games.append({'game_pk':str(g['gamePk']),'matchup':f"{away.get('abbreviation') or away.get('name')}@{home.get('abbreviation') or home.get('name')}"})
          if not games:
              raise SystemExit('EMPTY_OFFICIAL_SLATE')
          out=pathlib.Path('artifacts/investigacion_nrfi')/DATE
          out.mkdir(parents=True,exist_ok=True)
          extracts=[]
          for item in games:
              game_pk=item['game_pk']; matchup=item['matchup']
              url=f'https://statsapi.mlb.com/api/v1.1/game/{game_pk}/feed/live'
              with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=60) as r:
                  body=r.read()
              payload=json.loads(body); gd=payload.get('gameData',{}); ld=payload.get('liveData',{})
              plays=[p for p in ld.get('plays',{}).get('allPlays',[]) if p.get('about',{}).get('inning')==1]
              box=ld.get('boxscore',{}).get('teams',{})
              innings=ld.get('linescore',{}).get('innings') or []
              if not innings: raise SystemExit(f'NO_LINESCORE {game_pk}')
              extracts.append({'game_pk':game_pk,'matchup':matchup,'source_url':url,'sha256':hashlib.sha256(body).hexdigest(),'game_datetime':gd.get('datetime'),'status':gd.get('status'),'venue':gd.get('venue'),'weather':gd.get('weather'),'game_info':gd.get('gameInfo'),'teams':gd.get('teams'),'probable_pitchers':gd.get('probablePitchers'),'players':gd.get('players'),'away_boxscore':box.get('away'),'home_boxscore':box.get('home'),'first_inning_plays':plays,'linescore_first':innings[0],'final_linescore':ld.get('linescore',{})})
          manifest={'date':DATE,'schedule_source':sched,'schedule_sha256':hashlib.sha256(schedule_body).hexdigest(),'games':games,'count':len(games)}
          (out/'first_inning_extract.json').write_text(json.dumps(extracts,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('OFFICIAL_SLATE_COUNT',len(games)); print('GAME_PKS',[x['game_pk'] for x in games])
          PY
      - name: Persist reproducible official extract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/investigacion_nrfi/2026-08-03/first_inning_extract.json artifacts/investigacion_nrfi/2026-08-03/manifest.json
          git diff --cached --quiet || git commit -m 'Persist official MLB GUMBO extract for investigacionNRFI 2026-08-03'
          git push
